[project]
name = "campusverse-backend"
version = "0.1.0"
description = "CampusVerse API: Django + Django Ninja"
requires-python = ">=3.13"
dependencies = [
    "django[argon2]>=5.2,<6.0",
    "django-ninja>=1.4",
    "django-allauth[mfa]>=65.0",
    "django-environ>=0.12",
    "django-simple-history>=3.8",
    "rules>=3.5",
    "celery[redis]>=5.5",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
